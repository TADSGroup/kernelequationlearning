# GPU-capable alternative to pinnsr_env: pinnsr_env's tensorflow-gpu==1.15.0 bundles
# cuBLAS 10.0, which has no GEMM kernels for Ada Lovelace / sm_89 (RTX 40-series) and
# newer GPUs. This env swaps in nvidia-tensorflow (NVIDIA's patched TF1.15 build),
# whose pip-resolved nvidia-cublas-cu12/nvidia-cudnn-cu12 do support current-gen GPUs,
# keeping the same TF1.15 API used by the PINN-SR training scripts.
#
# CAVEAT: verified only to run without error on Ada Lovelace GPUs -- it does NOT
# reproduce the exact published coefficients_test.py results. Full-scale runs on this
# env found a different active PDE term (u_xx, coeff ~0.070) than the committed result
# (u_tx**2, coeff ~0.00011, i.e. noise), from GPU-side non-determinism in the neural
# net training that a fixed seed doesn't protect against. For reproducing the paper's
# PINN-SR numbers, use pinnsr_env on CPU (CUDA_VISIBLE_DEVICES="") instead -- it
# matches the committed results bit-for-bit and finishes in under 2 minutes. Only reach
# for this env for new PINN-SR work where exact reproduction of the published run
# isn't the goal.
name: pinnsr_gpu_env
channels:
  - defaults
dependencies:
  - _libgcc_mutex=0.1=main
  - _openmp_mutex=5.1=52_gnu
  - ca-certificates=2026.7.16=h06a4308_0
  - ld_impl_linux-64=2.44=h9e0c5a2_3
  - libffi=3.4.8=h06d3fd0_3
  - libgcc=15.2.0=h69a1729_8
  - libgcc-ng=15.2.0=h166f726_8
  - libstdcxx=15.2.0=h39759b7_8
  - libstdcxx-ng=15.2.0=hc03a8fd_8
